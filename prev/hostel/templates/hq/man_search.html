{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/hq/man_search.css' %}">
<link rel="stylesheet" href="{% static 'css/hq/read_hostels.css' %}">
<link rel="stylesheet" href="{% static 'css/mobile/hq/man_search.css' %}"
    <div class="side_nav">
        <div class='filter_form'>
        <form method="POST" action='.'>
            {% csrf_token %}
            <input type="hidden" name='search_query' value="{{ search_query }}">
            <h3 class="side_nav_title" style='text-align: center; font-family: var(--font2); margin: 20px;'>
            Filter Search
            </h3>
            <div class="filter_group">
            <label class="filter_label">
                <i class="fa-solid fa-bed"></i> Room Type
            </label>
            <div>
                <input type="text" name="number_in_room" id="number_in_room" placeholder="Number in room" class="number_input">
            </div>
            </div>
            <div class="filter_group">
            <label class="filter_label">
                <i class="fa-solid fa-money-bill-wave"></i> Price Range
            </label>
            <div>
                <input type="text" name="price_min" id="price_min" placeholder="Min Price" class="price_input">
                <span> <i class="fa-solid fa-arrow-right"></i> </span>
                <input type="text" name="price_max" id="price_max" placeholder="Max Price" class="price_input">
            </div>
            </div>
            <div class="filter_group">
            <label class="filter_label">
                <i class="fa-solid fa-venus-mars"></i> Gender
            </label>
            <div>
                <select name="gender" id="gender_select" class="gender_select">
                    {% for option in gender_options %}
                        <option value="{{ option }}"> {{ option|capfirst }}</option>
                    {% endfor %}
                </select>
            </div>
            </div>
            <button type="submit" class="filter_submit" name='filter_button'>
             Apply Filters
            </button>
        </form>
    </div>
    </div>
        {% include "hq/hostel_template.html" %}
        <script>
        // Utility function to make input field accept only numbers (including zero as first digit)
        function makeNumericInput(inputElement) {
          inputElement.type = 'text'; // Change from number to text to allow zero as first digit
          
          inputElement.addEventListener('input', function(e) {
            // Remove any non-numeric characters
            let value = e.target.value.replace(/[^0-9]/g, '');
            e.target.value = value;
          });
          
          inputElement.addEventListener('keypress', function(e) {
            // Allow: backspace, delete, tab, escape, enter
            if ([8, 9, 27, 13, 46].indexOf(e.keyCode) !== -1 ||
                // Allow: Ctrl+A, Ctrl+C, Ctrl+V, Ctrl+X
                (e.keyCode === 65 && e.ctrlKey === true) ||
                (e.keyCode === 67 && e.ctrlKey === true) ||
                (e.keyCode === 86 && e.ctrlKey === true) ||
                (e.keyCode === 88 && e.ctrlKey === true)) {
              return;
            }
            // Ensure that it is a number and stop the keypress
            if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) {
              e.preventDefault();
            }
          });
          
          inputElement.addEventListener('paste', function(e) {
            // Allow paste but filter out non-numeric characters
            e.preventDefault();
            let paste = (e.clipboardData || window.clipboardData).getData('text');
            let numericPaste = paste.replace(/[^0-9]/g, '');
            e.target.value = numericPaste;
          });
        }

        // Apply numeric validation to all number input fields when page loads
        document.addEventListener('DOMContentLoaded', function() {
          const numberInRoomInput = document.getElementById('number_in_room');
          const priceMinInput = document.getElementById('price_min');
          const priceMaxInput = document.getElementById('price_max');
          
          if (numberInRoomInput) makeNumericInput(numberInRoomInput);
          if (priceMinInput) makeNumericInput(priceMinInput);
          if (priceMaxInput) makeNumericInput(priceMaxInput);
        });
        </script>
        <script src="{% static 'js/hq/read_hostel.js' %}"></script> 
{% endblock content %}
