<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
        }
        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .action-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .action-btn:hover {
            background: #2980b9;
        }
        .action-btn.test {
            background: #e74c3c;
        }
        .action-btn.test:hover {
            background: #c0392b;
        }
        .action-btn.logs {
            background: #27ae60;
        }
        .action-btn.logs:hover {
            background: #229954;
        }
        .test-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .test-section h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .test-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .test-btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }
        .test-btn:hover {
            background: #e67e22;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ title }}</h1>
            <p>Monitor and manage the email notification system</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <p class="number">{{ total_users }}</p>
            </div>
            <div class="stat-card">
                <h3>Active Users</h3>
                <p class="number">{{ active_users }}</p>
            </div>
            <div class="stat-card">
                <h3>Staff Users</h3>
                <p class="number">{{ staff_users }}</p>
            </div>
        </div>
        
        <div class="actions">
            <a href="{% url 'email_service:test_email_system' %}" class="action-btn test">
                🧪 Test Email System
            </a>
            <a href="{% url 'email_service:email_logs' %}" class="action-btn logs">
                📋 View Logs
            </a>
            <a href="/admin/" class="action-btn">
                ⚙️ Admin Panel
            </a>
        </div>
        
        <div class="test-section">
            <h3>Quick Email Tests</h3>
            <p>Test different types of email notifications:</p>
            
            <div class="test-buttons">
                <button class="test-btn" onclick="testEmail('reservation')">
                    📅 Reservation
                </button>
                <button class="test-btn" onclick="testEmail('payment')">
                    💳 Payment
                </button>
                <button class="test-btn" onclick="testEmail('maintenance')">
                    🔧 Maintenance
                </button>
                <button class="test-btn" onclick="testEmail('security')">
                    🔒 Security
                </button>
                <button class="test-btn" onclick="testEmail('analytics')">
                    📊 Analytics
                </button>
                <button class="test-btn" onclick="testEmail('bulk')">
                    📢 Bulk
                </button>
            </div>
            
            <div id="status" class="status"></div>
        </div>
    </div>
    
    <script>
        function testEmail(type) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = 'status';
            statusDiv.textContent = 'Sending test email...';
            
            fetch('{% url "email_service:test_email_system" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: `test_type=${type}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = data.message;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = data.message;
                }
            })
            .catch(error => {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Error: ' + error.message;
            });
        }
    </script>
    
    {% csrf_token %}
</body>
</html>
